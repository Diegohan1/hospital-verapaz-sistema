# Sprint 8: Nginx sirve la SPA compilada y hace proxy de /api hacia el
# backend (dentro de la red privada de docker compose). Fallback a
# index.html para que React Router funcione con URLs compartibles.
server {
  listen 80;
  server_name _;

  root /usr/share/nginx/html;
  index index.html;

  # Limite generoso para multipart/form-data (anexos de hasta 15 MB);
  # el backend aplica los limites finos por tipo de archivo.
  client_max_body_size 20m;

  location /api/ {
    proxy_pass http://backend:4000;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_read_timeout 120s;
  }

  location / {
    try_files $uri $uri/ /index.html;
  }
}
